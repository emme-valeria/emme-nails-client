<!doctype html>

    <title>Emme Studio</title>
    <meta name="description" content="App nativa iOS para clientas de Emme Studio con diseño Apple Human Interface Guidelines (HIG), agenda inteligente, asistente IA y cotizaciones en tiempo real." />
    <meta property="og:title" content="Emme Studio" />
    <meta property="og:description" content="App nativa iOS para clientas de Emme Studio con diseño Apple Human Interface Guidelines (HIG), agenda inteligente, asistente IA y cotizaciones en tiempo real." />

    <!-- Suppress Vite HMR WebSocket connection failure in preview iframe environment -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          // Intercept Vite HMR WebSocket so it never triggers connection errors or rejects
          try {
            var OriginalWebSocket = window.WebSocket;
            if (OriginalWebSocket) {
              window.WebSocket = function(url, protocols) {
                if (typeof url === 'string' && (url.includes('vite') || protocols === 'vite-hmr' || url.includes('/@vite/'))) {
                  var fakeSocket = {
                    binaryType: 'blob',
                    bufferedAmount: 0,
                    extensions: '',
                    protocol: 'vite-hmr',
                    readyState: 1, // OPEN
                    url: url,
                    CONNECTING: 0,
                    OPEN: 1,
                    CLOSING: 2,
                    CLOSED: 3,
                    send: function() {},
                    close: function() {},
                    addEventListener: function(type, listener) {
                      if (type === 'open') {
                        setTimeout(function() {
                          try { listener({ type: 'open' }); } catch (e) {}
                        }, 0);
                      }
                    },
                    removeEventListener: function() {},
                    dispatchEvent: function() { return true; },
                    onopen: null,
                    onmessage: null,
                    onerror: null,
                    onclose: null,
                  };
                  setTimeout(function() {
                    if (typeof fakeSocket.onopen === 'function') {
                      try { fakeSocket.onopen({ type: 'open' }); } catch (e) {}
                    }
                  }, 0);
                  return fakeSocket;
                }
                return new OriginalWebSocket(url, protocols);
              };
              window.WebSocket.prototype = OriginalWebSocket.prototype;
              window.WebSocket.CONNECTING = 0;
              window.WebSocket.OPEN = 1;
              window.WebSocket.CLOSING = 2;
              window.WebSocket.CLOSED = 3;
            }
          } catch (e) {}

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            if (
              reason &&
              (
                (typeof reason.message === 'string' && (reason.message.includes('WebSocket') || reason.message.includes('ws') || reason.message.includes('closed without opened'))) ||
                (typeof reason.stack === 'string' && (reason.stack.includes('@vite/client') || reason.stack.includes('vite/dist/client')))
              )
            ) {
              event.preventDefault();
              event.stopPropagation();
            }
          });
          window.addEventListener('error', function(event) {
            if (
              (event.message && (event.message.includes('WebSocket') || event.message.includes('ws') || event.message.includes('closed without opened'))) ||
              (event.filename && (event.filename.includes('@vite/client') || event.filename.includes('vite/dist/client')))
            ) {
              event.preventDefault();
              event.stopPropagation();
            }
          });
        }
      })();
    </script>

    <!-- Apple HIG & iOS PWA Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

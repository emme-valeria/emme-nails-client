<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Ambient 3D lighting for head -->
    <radialGradient id="head3D" cx="44%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FCF8FA" />
      <stop offset="85%" stop-color="#EFE2E9" />
      <stop offset="100%" stop-color="#DDCBD5" />
    </radialGradient>

    <!-- Ear exterior 3D cylinder lighting -->
    <linearGradient id="earOuterGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FBF6F8" />
      <stop offset="85%" stop-color="#EBDFE5" />
      <stop offset="100%" stop-color="#DCB8C8" />
    </linearGradient>

    <!-- Inner ear soft pink depth -->
    <linearGradient id="earInnerGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDB9CA" />
      <stop offset="75%" stop-color="#F28EAA" />
      <stop offset="100%" stop-color="#E57D99" />
    </linearGradient>

    <!-- Paw soft 3D ball gradient -->
    <radialGradient id="paw3D" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FDF8FA" />
      <stop offset="88%" stop-color="#EFE0E8" />
      <stop offset="100%" stop-color="#DFC8D5" />
    </radialGradient>

    <!-- Eye gloss specular -->
    <radialGradient id="eyeGloss" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4F3634" />
      <stop offset="60%" stop-color="#372120" />
      <stop offset="100%" stop-color="#241313" />
    </radialGradient>

    <!-- Diffused Airbrush Filter for Cheeks -->
    <filter id="airbrushBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" />
    </filter>

    <!-- Soft clay ambient occlusion drop shadow -->
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4A192C" flood-opacity="0.14" />
    </filter>

    <!-- Ear junction shadow -->
    <radialGradient id="earShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A192C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4A192C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left Ear -->
  <g transform="rotate(-8 112 110)" filter="url(#clayShadow)">
    <rect x="92" y="32" width="46" height="120" rx="23" fill="url(#earOuterGrad)" />
    <rect x="100" y="50" width="28" height="88" rx="14" fill="url(#earInnerGrad)" />
  </g>

  <!-- Right Ear -->
  <g transform="rotate(8 208 110)" filter="url(#clayShadow)">
    <rect x="182" y="32" width="46" height="120" rx="23" fill="url(#earOuterGrad)" />
    <rect x="192" y="50" width="28" height="88" rx="14" fill="url(#earInnerGrad)" />
  </g>

  <!-- Ear base occlusion shadow behind head -->
  <ellipse cx="112" cy="148" rx="24" ry="10" fill="url(#earShadow)" />
  <ellipse cx="208" cy="148" rx="24" ry="10" fill="url(#earShadow)" />

  <!-- Chubby Bunny Head (Squircle silhouette from user 3D render) -->
  <g filter="url(#clayShadow)">
    <path d="M 64 205 
             C 60 148, 100 120, 160 120 
             C 220 120, 260 148, 256 205 
             C 252 258, 226 270, 160 270 
             C 94 270, 68 258, 64 205 Z" 
          fill="url(#head3D)" />
  </g>

  <!-- Airbrushed Rosy Cheeks (large soft pink circles matching user image) -->
  <g filter="url(#airbrushBlur)">
    <circle cx="106" cy="225" r="23" fill="#FF7B9B" opacity="0.68" />
    <circle cx="214" cy="225" r="23" fill="#FF7B9B" opacity="0.68" />
  </g>

  <!-- Left Bead Eye -->
  <g>
    <ellipse cx="134" cy="204" rx="6.5" ry="7.5" fill="url(#eyeGloss)" />
    <circle cx="132" cy="201.5" r="1.8" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Right Bead Eye -->
  <g>
    <ellipse cx="186" cy="204" rx="6.5" ry="7.5" fill="url(#eyeGloss)" />
    <circle cx="184" cy="201.5" r="1.8" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Tiny Cute Pastel Nose (no mouth, exactly matching the 3D model) -->
  <ellipse cx="160" cy="208" rx="4.8" ry="3.6" fill="#EA7D9C" />

  <!-- Left Front Paw resting on the ledge -->
  <g transform="rotate(5 92 265)" filter="url(#clayShadow)">
    <ellipse cx="90" cy="265" rx="24" ry="17" fill="url(#paw3D)" />
  </g>

  <!-- Right Front Paw resting on the ledge -->
  <g transform="rotate(-5 228 265)" filter="url(#clayShadow)">
    <ellipse cx="230" cy="265" rx="24" ry="17" fill="url(#paw3D)" />
  </g>
</svg>
